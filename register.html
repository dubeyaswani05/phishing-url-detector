{% extends "base.html" %}
{% block title %}PhishGuard — Sign Up{% endblock %}
{% block content %}
  <div class="auth-wrap">
    <p class="eyebrow">Free, no email needed</p>
    <h1>Create an Account</h1>
    <p class="subtitle">Create a free account to get started.</p>

    <div class="card auth-card">
      <form method="POST">
        <label class="field-label">Choose a username</label>
        <input type="text" name="username" placeholder="your_username" autocomplete="username" required />
        <label class="field-label">Password</label>
        <input type="password" name="password" placeholder="At least 4 characters" autocomplete="new-password" required />
        <label class="field-label">Confirm Password</label>
        <input type="password" name="confirm" placeholder="Re-enter password" autocomplete="new-password" required />
        <button type="submit" class="auth-submit">Create Account</button>
      </form>
    </div>
    <p class="auth-switch">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    <p class="auth-switch"><a href="{{ url_for('index') }}">Continue as guest →</a></p>
  </div>
{% endblock %}
